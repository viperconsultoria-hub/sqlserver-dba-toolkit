<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">Toolkit architecture</title>
  <desc id="desc">Data flows from SQL platforms through toolkit diagnostics to operations and dashboards.</desc>
  <rect width="1100" height="410" rx="18" fill="#f8fafc"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="50" y="100" width="240" height="210" rx="14" fill="#1e293b"/>
    <text x="170" y="145" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Data platforms</text>
    <text x="170" y="195" text-anchor="middle" fill="#cbd5e1" font-size="18">SQL Server</text>
    <text x="170" y="232" text-anchor="middle" fill="#cbd5e1" font-size="18">Azure SQL Database</text>
    <text x="170" y="269" text-anchor="middle" fill="#cbd5e1" font-size="18">Managed Instance</text>
    <path d="M305 205h120" stroke="#64748b" stroke-width="5"/>
    <path d="m425 205-18-12v24z" fill="#64748b"/>
    <rect x="445" y="55" width="260" height="300" rx="14" fill="#cc2927"/>
    <text x="575" y="103" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">DBA Toolkit</text>
    <text x="575" y="150" text-anchor="middle" fill="#fee2e2" font-size="18">Read-only diagnostics</text>
    <text x="575" y="191" text-anchor="middle" fill="#fee2e2" font-size="18">Preview-first operations</text>
    <text x="575" y="232" text-anchor="middle" fill="#fee2e2" font-size="18">Runbooks and references</text>
    <text x="575" y="273" text-anchor="middle" fill="#fee2e2" font-size="18">Dashboard datasets</text>
    <text x="575" y="314" text-anchor="middle" fill="#fee2e2" font-size="18">Automated quality gates</text>
    <path d="M720 205h100" stroke="#64748b" stroke-width="5"/>
    <path d="m820 205-18-12v24z" fill="#64748b"/>
    <rect x="840" y="100" width="210" height="210" rx="14" fill="#0369a1"/>
    <text x="945" y="145" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Outcomes</text>
    <text x="945" y="195" text-anchor="middle" fill="#e0f2fe" font-size="18">Incident response</text>
    <text x="945" y="232" text-anchor="middle" fill="#e0f2fe" font-size="18">Capacity planning</text>
    <text x="945" y="269" text-anchor="middle" fill="#e0f2fe" font-size="18">Audit evidence</text>
