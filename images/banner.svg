<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">SQL Server DBA Toolkit</title>
  <desc id="desc">A red and dark blue banner with a database icon and toolkit title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="40" r="160" fill="#cc2927" opacity=".14"/>
  <circle cx="1140" cy="290" r="210" fill="#38bdf8" opacity=".08"/>
  <g transform="translate(92 67)" filter="url(#shadow)">
    <ellipse cx="75" cy="30" rx="70" ry="27" fill="#ef4444"/>
    <path d="M5 30v112c0 15 31 27 70 27s70-12 70-27V30" fill="#cc2927"/>
    <ellipse cx="75" cy="86" rx="70" ry="27" fill="none" stroke="#fca5a5" stroke-width="5"/>
    <ellipse cx="75" cy="142" rx="70" ry="27" fill="#b91c1c" stroke="#fca5a5" stroke-width="5"/>
  </g>
  <text x="300" y="126" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="55" font-weight="700">SQL Server DBA Toolkit</text>
  <text x="304" y="178" fill="#bae6fd" font-family="Segoe UI,Arial,sans-serif" font-size="24">Diagnostics • Operations • Security • Observability</text>
  <text x="304" y="220" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="18">Open-source, production-minded T-SQL for the community</text>
</svg>
